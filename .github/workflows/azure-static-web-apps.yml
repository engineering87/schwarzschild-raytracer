name: Deploy to Azure Static Web Apps

# The site is one static HTML file, so there is nothing to build. Deployment
# runs only on push to main. Pull requests are deliberately left out: preview
# environments for a single page cost more attention than they return, and the
# reference renderer under tools/ already gives a way to inspect a change
# before it lands.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-swa
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: azure-static-web-apps
      url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Stage the site
        # Only the simulation and its configuration are published. The images,
        # the offline renderer, and the documentation stay in the repository
        # and are not served, which keeps the deployed payload under 100 kB.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp staticwebapp.config.json _site/
          ls -la _site

      - name: Fail early when the deployment token is missing
        # The deploy action reports a missing token as an unknown exception
        # several steps later, which is hard to read in the log. Check it here
        # and say what to do about it.
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is empty or unset."
            echo "Create the Static Web App, read its deployment token with"
            echo "  az staticwebapp secrets list --name <app> --query properties.apiKey -o tsv"
            echo "and store it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          echo "Token present, length ${#TOKEN}."

      - name: Deploy
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_site'
          api_location: ''
          output_location: ''
          skip_app_build: true
