name: Deploy to Azure Static Web Apps

# The site is one static HTML file, so there is nothing to build. Deployment
# runs only on push to main. Pull requests are deliberately left out: preview
# environments for a single page cost more attention than they return, and the
# reference renderer under tools/ already gives a way to inspect a change
# before it lands.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-swa
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deployment token
        # The deploy action reports a missing token as an unknown exception
        # inside its container, which is hard to read in the log. Resolve the
        # secret here and say plainly whether it arrived. The value is never
        # printed, only its length and a short hash, both of which are safe.
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN resolved to an empty string."
            echo ""
            echo "The secret is missing, misnamed, or stored somewhere this job"
            echo "cannot read. Check, in order:"
            echo "  1. The Static Web App exists on Azure."
            echo "  2. Settings > Secrets and variables > Actions > Secrets tab,"
            echo "     not the Variables tab."
            echo "  3. The name matches exactly, including case."
            echo "  4. It is a repository secret, not an environment or"
            echo "     organization secret with restricted access."
            exit 1
          fi
          echo "Token resolved. Length ${#TOKEN}, fingerprint $(printf '%s' "${TOKEN}" | sha256sum | cut -c1-8)."

      - name: Stage the site
        # Only the simulation and its configuration are published. The images,
        # the offline renderer, and the documentation stay in the repository
        # and are not served, which keeps the deployed payload under 100 kB.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp staticwebapp.config.json _site/
          ls -la _site

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_site'
          api_location: ''
          output_location: ''
          skip_app_build: true
